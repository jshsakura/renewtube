name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      # 브라우저를 띄우지 않는 테스트만 돈다. 나머지는 live 유튜브에 붙으므로
      # CI 에서 돌리면 유튜브의 그날 사정이 우리 빌드의 합격 여부가 된다.
      - run: npx playwright test e2e/03-parse.spec.ts e2e/17-styles.spec.ts

      # 재생 실패 매트릭스는 유튜브에 붙지 않는다. 일부러 고장 나는 재생기를
      # 만들고(e2e/lab) page.route 로 youtube.com 을 통째로 대신 응답하므로,
      # 유튜브의 그날 사정과 무관하게 매번 돌 수 있다. 이게 "누른 곡은 결국
      # 소리가 난다"를 지키는 자리다. docs/playback.md 를 본다.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/19-playlists.spec.ts
      - run: node scripts/build-lab.mjs
      - run: npx playwright test e2e/16-playback.spec.ts

      # 빌드가 조용히 반쪽이 되는 것을 막는다. 확장은 파일 하나가 빠져도
      # "로드는 되지만 아무 일도 안 일어나는" 상태가 되고, 그건 로그가 없다.
      - name: 패키지에 있어야 할 것이 다 있나
        run: |
          set -e
          for f in dist/manifest.json dist/main.js dist/isolated.js dist/popup.html \
                   dist/popup.js dist/popup.css dist/icons/icon16.png \
                   dist/icons/icon48.png dist/icons/icon128.png \
                   dist/_locales/en/messages.json; do
            test -s "$f" || { echo "빠졌습니다: $f"; exit 1; }
          done
          # 매니페스트가 __MSG_ 로 이름과 설명을 참조하므로, default_locale 의
          # messages.json 이 빠지면 크롬이 확장을 아예 읽지 못한다. 위 목록에
          # 그것이 들어 있는 이유다. 나머지 언어는 없어도 영어로 뜬다.
          for d in dist/_locales/*/; do
            test -s "$d/messages.json" || { echo "빠졌습니다: $d/messages.json"; exit 1; }
          done
          node -e '
            const m = require("./dist/manifest.json");
            const main = m.content_scripts?.find((c) => c.js.includes("main.js"));
            // world:MAIN 이 빠지면 크롬에서 ytcfg 가 안 보인다. 오리온은 이 키를
            // 어차피 무시하고 주입 폴백으로 가지만, 그 폴백은 아래 한 줄이 있어야
            // 페이지가 main.js 를 받아올 수 있다.
            if (main?.world !== "MAIN") throw new Error("main.js 의 world 가 MAIN 이 아닙니다");
            const war = m.web_accessible_resources?.[0]?.resources ?? [];
            if (!war.includes("main.js")) throw new Error("main.js 가 web_accessible_resources 에 없습니다 — 오리온에서 주입이 막힙니다");
            if (m.version !== require("./package.json").version) {
              throw new Error("manifest 와 package.json 의 버전이 다릅니다");
            }
          '
          echo "확인했습니다"

      # 스토리북은 제품 코드를 그대로 임포트한다 — 진짜 STYLES, 진짜 row(),
      # 진짜 Engine. 그게 이 워크벤치의 값어치이고, 동시에 함정이다: 제품 쪽
      # 시그니처를 바꾸면 스토리가 깨지는데 **자기 tsconfig 로 따로 돌기 때문에
      # 루트의 `npm run check` 는 그걸 모른다.** 여기서 같이 묻지 않으면 디자인
      # 작업이 컴파일도 안 되는 워크벤치 위에서 이뤄지고, 아무도 모른 채 며칠이
      # 간다. 실제로 오늘 row() 의 인자 모양을 바꿨고, 그때는 우연히 안 깨졌다.
      #
      # 스토리북 자체를 빌드하지는 않는다. 물어야 할 것은 "스토리가 지금 제품과
      # 말이 되는가" 뿐이고, 그건 타입 검사로 답이 나온다.
      - name: 스토리북이 아직 제품과 말이 되는가
        run: |
          npm ci --prefix storybook
          npm run check --prefix storybook
